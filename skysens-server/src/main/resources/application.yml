# ---------------------------------------------------------------------------
# skysens-server
#
# No persistence yet — no datasource, no JPA, no Flyway. When the first entity
# arrives, add the dependencies and the datasource config together.
# ---------------------------------------------------------------------------
spring:
  application:
    name: skysens-server
  profiles:
    default: dev

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

skysens:
  auth:
    access-token-ttl: PT30M
    refresh-token-ttl: P30D
    handshake-challenge-ttl: PT2M
    mojang-has-joined-url: https://sessionserver.mojang.com/session/minecraft/hasJoined

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    de.vantrex.skysens: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
# TODO(deferred): datasource, connection pool and Flyway config once persistence
#                 lands (ADR-004). Deliberately empty until then.
