name: Release

# Every merge/push to master, promoted from beta, releases a new version to Modrinth
# and as a tagged GitHub release.
# The version comes from the git tags, nothing is committed back to master:
# - If mod_version in gradle.properties is higher than the latest v* tag, it is released as-is.
#   Use this for minor/major bumps: set e.g. mod_version=1.1.0 in your PR.
# - Otherwise the latest tag's patch number is bumped (v1.0.3 -> 1.0.4).

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", ".idea/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: modrinth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        run: |
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -n1)" != "$LATEST" ]; then
            VERSION="$BASE"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Releasing $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$VERSION"

      - name: Publish to Modrinth
        run: ./gradlew modrinth -Pmod_version="$VERSION"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_VERSION_TYPE: release
          CHANGELOG: ${{ github.event.head_commit.message }}

      # Creates the v<version> tag on this commit, only after the Modrinth upload succeeded.
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SkySens ${{ env.VERSION }}
          body: ${{ github.event.head_commit.message }}
          files: build/libs/skysens-${{ env.VERSION }}.jar
