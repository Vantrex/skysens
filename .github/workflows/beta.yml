name: Beta

# Every merge/push to beta publishes a beta version to Modrinth.
# The version is the next release version (same rules as release.yml) plus a beta suffix,
# e.g. 1.0.4-beta.12, where the number is this workflow's run number.
# No git tag or GitHub release is created, so betas never affect the release version numbering.

on:
  push:
    branches: [beta]
    paths-ignore: ["**.md", ".idea/**"]
  workflow_dispatch:

concurrency:
  group: beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  beta:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    environment: modrinth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        run: |
          BASE=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//')
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$BASE" | sort -V | tail -n1)" != "$LATEST" ]; then
            NEXT="$BASE"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          VERSION="$NEXT-beta.${{ github.run_number }}"
          echo "Publishing beta $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version="$VERSION"

      - name: Publish to Modrinth
        run: ./gradlew modrinth -Pmod_version="$VERSION"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_VERSION_TYPE: beta
          CHANGELOG: ${{ github.event.head_commit.message }}
